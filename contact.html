<!-- contact.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們｜CosDream</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Cos<span>Dream</span></div>
    <nav>
      <a href="index.html">首頁</a>
      <a href="products.html">產品介紹</a>
      <a href="contact.html" class="active">聯絡我們</a>
    </nav>
  </header>

  <section class="page-title">
    <h1>聯絡我們</h1>
    <p>有任何問題或客製需求，歡迎與我們聯繫</p>
  </section>

  <section class="contact-section">
    <form id="contactForm" class="contact-form">
      <label for="name">姓名</label>
      <input type="text" id="name" name="name" required placeholder="請輸入姓名">

      <label for="email">電子郵件</label>
      <input type="email" id="email" name="email" required placeholder="example@mail.com">

      <label for="message">訊息內容</label>
      <textarea id="message" name="message" rows="5" required placeholder="請描述您的需求..."></textarea>

      <button type="submit" class="btn">送出訊息</button>
      <p id="formMsg" class="form-msg"></p>
    </form>

    <div class="contact-info">
      <h3>聯絡資訊</h3>
      <p>地址：台北市信義區 Cosplay 路 88 號</p>
      <p>電話：(02) 1234-5678</p>
      <p>Email：hello@cosdream.com</p>
      <p>營業時間：週一至週日 10:00 - 21:00</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 CosDream. 保留所有權利。</p>
  </footer>

  <!-- 優惠彈窗 -->
  <div id="promoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>限時優惠</h2>
      <p>輸入優惠碼 <strong>COS2026</strong>，全站服裝享 85 折！</p>
      <p class="small">活動至 2026/12/31 止。</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
